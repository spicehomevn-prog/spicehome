<!-- @dsCard group="Colors" viewport="700x200" name="Neutrals — Cream & Ink" subtitle="Warm off-white surfaces, near-black for dark bands." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-page); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 84px; border: var(--border); }
  .name { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--text-body); margin-top: 10px; }
  .hex { font-family: var(--font-body); font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background: var(--sh-cream);"></div><div class="name">Cream</div><div class="hex">#FAFAF8 · --bg-page</div></div>
    <div class="sw"><div class="chip" style="background: var(--sh-white);"></div><div class="name">White</div><div class="hex">#FFFFFF · --bg-surface</div></div>
    <div class="sw"><div class="chip" style="background: var(--sh-line);"></div><div class="name">Line</div><div class="hex">#E8E4DC · --border-hairline</div></div>
    <div class="sw"><div class="chip" style="background: var(--sh-stone);"></div><div class="name">Stone</div><div class="hex">#7A7A72 · --text-muted</div></div>
    <div class="sw"><div class="chip" style="background: var(--sh-graphite);"></div><div class="name">Graphite</div><div class="hex">#2C2C2A · --text-body</div></div>
    <div class="sw"><div class="chip" style="background: var(--sh-ink);"></div><div class="name">Ink</div><div class="hex">#1A1A18 · --bg-inverse</div></div>
  </div>
</body>
</html>
