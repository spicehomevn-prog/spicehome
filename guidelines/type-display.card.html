<!-- @dsCard group="Type" viewport="700x230" name="Display — Playfair Display" subtitle="Serif for headings; italic is the signature hero voice." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg-surface); }
  .meta { font-family: var(--font-body); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); margin-bottom: 4px; }
  .d1 { font-family: var(--font-display); font-style: italic; font-size: 44px; line-height: 1.15; color: var(--text-heading); }
  .d2 { font-family: var(--font-display); font-size: 32px; line-height: 1.2; color: var(--text-heading); margin-top: 18px; }
  .d3 { font-family: var(--font-display); font-size: 20px; color: var(--text-heading); margin-top: 16px; }
</style>
</head>
<body>
  <div class="meta">Hero · Playfair Display Italic · 48px</div>
  <div class="d1">Your cozy home in&nbsp;Saigon</div>
  <div class="d2">Không chỉ là nơi ở</div>
  <div class="meta" style="margin-top:14px;">H3 · 20px · Regular</div>
  <div class="d3">Meet your local hosts</div>
</body>
</html>
