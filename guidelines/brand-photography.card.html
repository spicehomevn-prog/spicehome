<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-surface); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ph { aspect-ratio: 4/3; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .note { font-family: var(--font-body); font-size: 12px; color: var(--text-muted); margin-top: 14px; line-height: 1.6; }
  b { color: var(--text-body); font-weight: 600; }
</style>
</head>
<body>
  <div class="grid">
    <div class="ph"><img src="../assets/images/rooms/room-101/main.jpg" alt=""></div>
    <div class="ph"><img src="../assets/images/common/area3.jpg" alt=""></div>
    <div class="ph"><img src="../assets/images/rooms/room-203/main.jpg" alt=""></div>
    <div class="ph"><img src="../assets/images/common/staircase.jpg" alt=""></div>
  </div>
  <p class="note"><b>Warm, honest, lived-in.</b> Natural daylight, beige &amp; wood tones, terracotta accents. No heavy filters, no staged perfection — real rooms, slightly imperfect, documentary in spirit.</p>
</body>
</html>
